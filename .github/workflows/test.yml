name: Test

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-26.04-arm

    steps:
    - uses: actions/checkout@v7.0.1

    - uses: actions/create-github-app-token@v3.3.0
      id: get-github-apps
      with:
        client-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.PRIVATE_KEY }}
        owner: nnsnodnb
        repositories: gs-reminder

    - name: Install required-version defined in pyproject.toml
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.15"
        enable-cache: 'true'

    - name: Send Test
      env:
        GITHUB_TOKEN: ${{ steps.get-github-apps.outputs.token }}
        SLACK_URL: ${{ secrets.SLACK_URL }}
        REPOSITORY: ${{ github.repository }}
      run: |
        uv run python -m gs_reminder -r "${REPOSITORY}" -u ./examples/username.json

  tests:
    runs-on: ubuntu-26.04-arm

    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14", "3.15" ]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install required-version defined in pyproject.toml
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: 'true'

      - name: Run Tests
        run: uv run python -m pytest -v tests
