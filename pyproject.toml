[project]
name = "gs-reminder"
description = "Notify Slack of a review of Pull Requests in the GitHub repository."
authors = [{ name = "nnsnodnb", email = "nnsnodnb@gmail.com" }]
requires-python = ">=3.9,<3.14"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.32.5",
    "click>=8.1.3",
    "pydantic>=2.13.5",
]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/nnsnodnb/gs-reminder"

[project.scripts]
gs-reminder = "gs_reminder.notifier:main"

[dependency-groups]
dev = [
    "black>=26.3,<26.4",
    "isort>=6.1.0,<7.0.0",
    "flake8>=5.0.4,<8.0.0",
    "mypy>=0.991,<1.20",
    "types-requests>=2.32.4,<3.0.0",
    "requests-mock>=1.1.0,<2.0.0",
    "pytest>=7.0.0,<8.5.0",
    "hatch>=1.14.2",
    "uv-dynamic-versioning>=0.11.2",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["gs_reminder"]

[tool.hatch.build.targets.wheel]
include = ["gs_reminder"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.hooks.version]
path = "gs_reminder/_version.py"
vsc = "git"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
(
    /(
         \.git
        |\.github
        |\.mypy_cache
        |\.pytest_cache
    )/
)
'''

[tool.mypy]
ignore_missing_imports = true

[tool.isort]
include_trailing_comma = true
line_length = 120
multi_line_output = 5
