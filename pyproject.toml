[project]
name = "gs-reminder"
description = "Notify Slack of a review of Pull Requests in the GitHub repository."
authors = [{ name = "nnsnodnb", email = "nnsnodnb@gmail.com" }]
requires-python = ">=3.10,<3.16"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "click>=8.1.3",
    "pydantic>=2.13.5",
    "httpx2>=2.13.1",
]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/nnsnodnb/gs-reminder"

[project.scripts]
gs-reminder = "gs_reminder.notifier:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "hatch",
    "uv-dynamic-versioning",
    "ruff",
    "httpx2-pytest",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["gs_reminder"]

[tool.hatch.build.targets.wheel]
include = ["gs_reminder"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.hooks.version]
path = "gs_reminder/_version.py"
vsc = "git"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E501"]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.mypy]
ignore_missing_imports = true
